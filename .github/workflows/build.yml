name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cross-platform:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "Pillow>=10,<13"
          # dana.tools.schema (imported by dana.tools/__init__) validates tool
          # args with pydantic; it arrives transitively via fastapi in
          # requirements.txt, which this lightweight job doesn't install.
          pip install "pydantic>=2,<3"

      - name: Clean import checks
        shell: bash
        run: |
          python - <<'PY'
          import platform
          import dana.tools.setup_startup as startup

          print("system=", platform.system())
          # Import must never raise on any OS — every Windows-only call
          # (winreg) is deferred inside these functions, never at module
          # scope; this check is what catches a regression on that, not
          # something to skip on non-Windows runners.
          assert callable(startup.enable_startup)
          assert callable(startup.disable_startup)
          assert callable(startup.startup_status)
          print("import_ok")
          PY

  # Architecture gates: no NEW dana/core -> dana.plugins/dana.manufacturing
  # import (existing ones are baselined in scripts/ci/boundary_baseline.txt),
  # and no NEW unused code in the files a change touches (vulture, diffed
  # against the base revision so legacy dead code doesn't fail whoever
  # touches its file). Neither needs the app's dependencies.
  ci-gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the dead-code check exports the base revision

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vulture
        run: python -m pip install "vulture>=2.11,<3"

      - name: Core must not import domain plugins
        run: python scripts/ci/check_boundaries.py

      - name: No new dead code
        # PR: compare with the target branch's commit. Push: with the commit
        # before the push (all zeros on a new branch -> the script falls back
        # to the merge-base with origin/main, then HEAD~1).
        run: python scripts/ci/check_dead_code_incremental.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Boots app.py from the exact staged payload deploy_hf.yml ships, with the
  # Space's own Gradio version — catches committed code importing files that
  # were never committed (the 2026-09-24 Space RUNTIME_ERROR), which the
  # import check above can't see since it never touches dana.core.
  space-smoke:
    name: HF Space import smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Space runtime's default (space_README.md sets no python_version).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Stage Space payload
        run: bash deploy/stage_space.sh _hf_smoke_stage

      - name: Install Space dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels here only — requirements.txt deliberately leaves torch
          # unpinned for ZeroGPU, and PyPI's default CUDA build is several GB.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          GRADIO_VERSION="$(sed -nE 's/^sdk_version: *//p' deploy/space_README.md)"
          # `spaces` (ZeroGPU decorators, imported by app.py) is preinstalled
          # on HF Spaces but not on PyPI-only runners.
          pip install -r requirements.txt "gradio==${GRADIO_VERSION}" spaces

      - name: Import app.py the way the Space does
        working-directory: _hf_smoke_stage
        env:
          DANA_OS_DRY_RUN: "1"
          DANA_HEADLESS: "true"
        run: python -c "import app; print('space_import_ok')"

  # Full pytest suite — a blocking check (Sync to Hugging Face only runs after
  # Build succeeds). Known failures are marked xfail in the tests themselves;
  # `live_ollama` tests need a real Ollama server and are deselected here.
  tests:
    name: Pytest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Was 3.11 while openwakeword (tflite-runtime wheels stop at cp311)
          # was a dependency; it was removed on 2026-10-06.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system libraries
        # xvfb: conftest/UI tests create Tk roots, which need a display.
        # libportaudio2: sounddevice loads it at import time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libportaudio2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          GRADIO_VERSION="$(sed -nE 's/^sdk_version: *//p' deploy/space_README.md)"
          pip install -r requirements.txt -r requirements-dev.txt "gradio==${GRADIO_VERSION}" spaces

      - name: Run pytest (with coverage floor)
        env:
          DANA_OS_DRY_RUN: "1"
          DANA_HEADLESS: "true"
        # enforce_coverage.sh = this same pytest run under --cov, failing
        # below its COVERAGE_FLOOR (see the script for how it was set).
        run: xvfb-run -a bash scripts/ci/enforce_coverage.sh -m "not live_ollama" --strict-markers --timeout=300 -rfE --junitxml=pytest-report.xml

      - name: Annotate test failures
        # Surfaces each failing test as a GitHub annotation (visible on the
        # run summary and PRs without digging through the raw log).
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("pytest-report.xml")
          if not report.exists():
              raise SystemExit(0)
          for case in ET.parse(report).iter("testcase"):
              for problem in list(case.iter("failure")) + list(case.iter("error")):
                  test_id = f"{case.get('classname')}::{case.get('name')}"
                  detail = (problem.get("message") or problem.text or "").strip().splitlines()
                  message = " | ".join(detail[:6])[:900].replace("%", "%25").replace("\r", "").replace("\n", " ")
                  print(f"::error title={test_id}::{message}")
          PY

  # Same `tsc && vite build` Vercel runs — catches a component committed
  # without the caller change it depends on (the 2026-09-24 Vercel failure).
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
