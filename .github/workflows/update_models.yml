name: Update Model Catalog

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

# Catalog drift is reviewed by a human, never merged unattended: a validated
# change is pushed to automated/model-catalog-sync and offered as a PR. This
# repository's Actions policy may forbid workflows from opening PRs (the
# 2026-10 and 2026-11 runs failed exactly there); then the run still
# succeeds and its summary carries a one-click compare link instead.
jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automated/model-catalog-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync model catalog
        run: python scripts/sync_model_catalog.py | tee sync_output.txt

      - name: Validate the catalog
        # Standard library + pytest only; --noconftest skips tests/conftest.py,
        # which imports the whole app.
        run: |
          python -m pip install "pytest>=8,<9"
          python -m pytest --noconftest -p no:cacheprovider tests/test_models_catalog.py

      - name: Push the change for review
        id: push
        run: |
          if git diff --quiet -- dana/data/models_registry.json; then
            echo "Model catalog already up to date; nothing to review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(models): sync model catalog" -m "$(cat sync_output.txt)" -- dana/data/models_registry.json
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a PR, or link one
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...automated/model-catalog-sync?expand=1
        run: |
          {
            echo "Automated run of \`scripts/sync_model_catalog.py\` against OpenRouter's public"
            echo "\`/api/v1/models\` catalog, validated by \`tests/test_models_catalog.py\`."
            echo
            echo '```'
            cat sync_output.txt
            echo '```'
          } > pr_body.md
          if gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore(models): monthly model catalog sync" --body-file pr_body.md 2> pr_error.txt; then
            echo "Opened a pull request for the model catalog change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qi "already exists" pr_error.txt; then
            echo "The open model catalog PR was updated with this run's change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Model catalog changed"
            echo
            echo "GitHub Actions may not open pull requests in this repository, so the validated change"
            echo "was pushed to \`$BRANCH\`. **[Review and merge it]($COMPARE_URL)**"
            echo
            cat pr_body.md
            echo
            echo "<details><summary>gh pr create said</summary>"
            echo
            echo '```'
            cat pr_error.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
