name: Sync

on:
  push:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Router corridor + schema imports need LangGraph / Pydantic.
          pip install "langgraph==0.3.34" "langchain-core==0.3.86" "pydantic>=2,<3"

      - name: Core module import check
        shell: bash
        run: |
          python - <<'PY'
          import dana.paths
          import dana.schema
          import dana.stdio_boot
          from dana.stdio_boot import ensure_stdio
          assert callable(ensure_stdio)
          print("smoke_import_ok")
          PY

      - name: Unit tests (router + environment)
        shell: bash
        run: |
          python -m pytest tests/test_environment.py tests/test_router.py -q --tb=short

  sync-to-hf:
    name: Sync to Hugging Face
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: Cascade-Router/Donna
          huggingface_repo_id: AMIXXM/Donna
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
