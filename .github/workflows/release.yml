# Automated OTA release pipeline.
# Triggers on tag push matching v*.*.* (e.g. v0.1.0).
#
# Publishes:
#   - dana-engine-<tag>.tar.gz  — dana/ package tree (+ scripts/) excluding
#     __pycache__, .venv, and heavy optional assets (tts_models/*.onnx blobs).
#   - latest.json               — OTA manifest for OTAManifestManager
#     (fields: version, url|package_url, sha256; version without leading "v").
#
# Cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0

name: OTA Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  ota-release:
    name: Test, package, publish OTA
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          # Tray / logo tests need Pillow (also in requirements.txt; keep explicit).
          pip install "Pillow>=10,<13"

      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short

      - name: Derive version metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          ASSET="dana-engine-${TAG}.tar.gz"
          URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}/${ASSET}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Packaging OTA asset=${ASSET} version=${VERSION}"

      - name: Package dana engine tarball
        shell: bash
        run: |
          # Package dana/ core + scripts/. Exclude caches, venvs, and optional
          # heavy TTS ONNX blobs under tts_models/ (download separately if needed).
          # Python packaging avoids rsync (unavailable on windows-latest).
          python - <<'PY'
          import tarfile, tempfile
          from pathlib import Path
          asset = "${{ steps.meta.outputs.asset }}"
          stage = Path(tempfile.mkdtemp(prefix="dana-ota-"))
          root = stage / "dana-engine"
          root.mkdir(parents=True)
          exclude_dirs = {"__pycache__", ".venv", "venv", "tts_models"}
          exclude_suffixes = {".pyc", ".pyo", ".pyd", ".onnx"}
          def copy_tree(src, dst):
              for path in src.rglob("*"):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(src)
                  if any(part in exclude_dirs for part in rel.parts):
                      continue
                  if path.suffix.lower() in exclude_suffixes:
                      continue
                  target = dst / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())
          copy_tree(Path("dana"), root / "dana")
          if Path("scripts").is_dir():
              copy_tree(Path("scripts"), root / "scripts")
          if Path("pyproject.toml").is_file():
              (root / "pyproject.toml").write_bytes(Path("pyproject.toml").read_bytes())
          with tarfile.open(asset, "w:gz") as tf:
              tf.add(str(root), arcname="dana-engine")
          print(asset, Path(asset).stat().st_size)
          PY


      - name: Calculate SHA256 and write latest.json
        shell: bash
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          SHA256=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$ASSET")
          # Align with dana/updater/manifest.py ManifestInfo.from_dict:
          #   version (no leading v), url|package_url, sha256
          python - <<PY
          import json
          payload = {
              "version": "${{ steps.meta.outputs.version }}",
              "url": "${{ steps.meta.outputs.url }}",
              "package_url": "${{ steps.meta.outputs.url }}",
              "sha256": "${SHA256}",
              "release_notes": "Automated OTA Release",
          }
          with open("latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          print(json.dumps(payload, indent=2))
          PY
          echo "SHA256=${SHA256}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Dana ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.meta.outputs.asset }}
            latest.json
          body: |
            Automated OTA Release `${{ steps.meta.outputs.version }}`.

            Assets:
            - `${{ steps.meta.outputs.asset }}` — dana engine package
            - `latest.json` — OTA manifest (`version`, `url`/`package_url`, `sha256`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
