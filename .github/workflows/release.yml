# Release pipeline. Triggers on tag push matching v*.*.* (e.g. v0.1.0).
#
# Publishes:
#   - dana-engine-<tag>.tar.gz         — dana/ package tree (+ scripts/) excluding
#     __pycache__, .venv, and heavy optional assets (tts_models/*.onnx blobs).
#   - dana-engine-<tag>.tar.gz.sha256  — its checksum.
#
# (It used to also publish latest.json, an OTA manifest for dana/updater's
# OTAManifestManager. That updater was removed and nothing reads the file.)
#
# Cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  ota-release:
    name: Test, package, publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          # Tray / logo tests need Pillow (also in requirements.txt; keep explicit).
          pip install "Pillow>=10,<13"

      - name: Run full test suite
        # Same safety locks as the Build workflow: no OS automation, no GUI.
        env:
          DANA_OS_DRY_RUN: "1"
          DANA_HEADLESS: "true"
        run: python -m pytest tests/ --tb=short -m "not live_ollama" --timeout=300

      - name: Derive version metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET="dana-engine-${TAG}.tar.gz"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "Packaging OTA asset=${ASSET} version=${VERSION}"

      - name: Package dana engine tarball
        shell: bash
        run: |
          # Package dana/ core + scripts/. Exclude caches, venvs, and optional
          # heavy TTS ONNX blobs under tts_models/ (download separately if needed).
          # Python packaging avoids rsync (unavailable on windows-latest).
          python - <<'PY'
          import tarfile, tempfile
          from pathlib import Path
          asset = "${{ steps.meta.outputs.asset }}"
          stage = Path(tempfile.mkdtemp(prefix="dana-ota-"))
          root = stage / "dana-engine"
          root.mkdir(parents=True)
          exclude_dirs = {"__pycache__", ".venv", "venv", "tts_models"}
          exclude_suffixes = {".pyc", ".pyo", ".pyd", ".onnx"}
          def copy_tree(src, dst):
              for path in src.rglob("*"):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(src)
                  if any(part in exclude_dirs for part in rel.parts):
                      continue
                  if path.suffix.lower() in exclude_suffixes:
                      continue
                  target = dst / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())
          copy_tree(Path("dana"), root / "dana")
          if Path("scripts").is_dir():
              copy_tree(Path("scripts"), root / "scripts")
          if Path("pyproject.toml").is_file():
              (root / "pyproject.toml").write_bytes(Path("pyproject.toml").read_bytes())
          with tarfile.open(asset, "w:gz") as tf:
              tf.add(str(root), arcname="dana-engine")
          print(asset, Path(asset).stat().st_size)
          PY


      - name: Write SHA256 checksum
        shell: bash
        run: |
          ASSET="${{ steps.meta.outputs.asset }}"
          python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest() + '  ' + sys.argv[1])" "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Dana ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.meta.outputs.asset }}
            ${{ steps.meta.outputs.asset }}.sha256
          body: |
            Release `${{ steps.meta.outputs.version }}`.

            Assets:
            - `${{ steps.meta.outputs.asset }}` — dana engine package
            - `${{ steps.meta.outputs.asset }}.sha256` — its SHA-256 checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
