name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'dana/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy_hf.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage Docker Space payload (Dockerfile + dana/ + frontend/ source)
        run: |
          set -e
          rm -rf _hf_deploy_stage
          mkdir -p _hf_deploy_stage
          cp Dockerfile _hf_deploy_stage/Dockerfile
          cp .dockerignore _hf_deploy_stage/.dockerignore
          mkdir -p _hf_deploy_stage/deploy
          cp deploy/requirements-space.txt _hf_deploy_stage/deploy/requirements-space.txt
          cp deploy/space_README.md _hf_deploy_stage/README.md

          cp -r dana _hf_deploy_stage/dana
          find _hf_deploy_stage/dana -name "__pycache__" -type d -prune -exec rm -rf {} +

          mkdir -p _hf_deploy_stage/frontend
          cp -r frontend/src _hf_deploy_stage/frontend/src
          cp -r frontend/public _hf_deploy_stage/frontend/public 2>/dev/null || true
          cp frontend/package.json frontend/package-lock.json frontend/index.html \
             frontend/vite.config.ts frontend/tsconfig.json frontend/tsconfig.node.json \
             _hf_deploy_stage/frontend/ 2>/dev/null || true
          # Docker builds the frontend itself (see Dockerfile's frontend-build
          # stage) — src-tauri/node_modules/dist are desktop/build artifacts
          # the Space's Docker build never needs.

      - name: Deploy staged payload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        working-directory: _hf_deploy_stage
        run: |
          set -e
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Dana Docker Space (dana/ + frontend/) from ${{ github.sha }}"
          git push -f "https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME" HEAD:main
