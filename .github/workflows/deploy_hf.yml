name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage Gradio Space payload (app.py + dana/)
        run: |
          set -e
          rm -rf _hf_deploy_stage
          mkdir -p _hf_deploy_stage
          cp app.py _hf_deploy_stage/app.py
          cp packages.txt _hf_deploy_stage/packages.txt
          # deploy/requirements-space.txt doesn't exist (was never
          # committed even though this step referenced it) — root
          # requirements.txt is the proven-correct file already used for
          # this exact codebase locally, so point at that instead of
          # fabricating a hand-trimmed subset that risks silently omitting
          # something app.py's own import chain actually needs at boot.
          # It installs more than a minimal Space container strictly needs
          # (the desktop/audio/Windows-only stack), which is real but
          # separate follow-up work: trimming it requires verifying
          # app.py's full transitive import graph, not guessing.
          cp requirements.txt _hf_deploy_stage/requirements.txt
          cp deploy/space_README.md _hf_deploy_stage/README.md

          cp -r dana _hf_deploy_stage/dana
          find _hf_deploy_stage/dana -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Deploy staged payload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        working-directory: _hf_deploy_stage
        run: |
          set -e
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Dana Gradio Space (app.py + dana/) from ${{ github.sha }}"
          git push -f "https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME" HEAD:main