name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
    paths:
      - 'hf_space/**'
      - '.github/workflows/deploy_hf.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy hf_space to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Isolate hf_space/ into a standalone deploy branch
          git subtree split --prefix hf_space -b hf-deploy

          # Push directly to the Hugging Face Space repository
          git push https://oauth2:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME hf-deploy:main --force
