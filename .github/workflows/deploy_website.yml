name: Deploy Astro website

# Stage 9 — build website/ with Astro and publish dist/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy_website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build Astro site
        working-directory: website
        env:
          # Project Pages URL: https://cascade-router.github.io/Dana/
          SITE_URL: https://cascade-router.github.io
          BASE_PATH: /Dana/
          ASTRO_PAGES: "1"
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
